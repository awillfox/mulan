{{template "title" .}}
{{define "title"}}Option Groups{{end}}

{{define "content"}}
<div class="bg-white rounded-lg shadow">
    <div class="p-6 border-b flex items-center justify-between">
        <h2 class="text-lg font-bold">Option Groups</h2>
        <button onclick="openGroupModal()" class="bg-blue-600 text-white text-sm px-3 py-1.5 rounded hover:bg-blue-700">+ Add Group</button>
    </div>
    <div class="divide-y" id="group-list"></div>
</div>

<!-- Group Modal -->
<div id="group-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-96 p-6">
        <h3 class="font-bold text-lg mb-4" id="group-modal-title">Add Option Group</h3>
        <div class="space-y-3">
            <div>
                <label class="block text-sm text-gray-600 mb-1">Name</label>
                <input id="group-name" type="text" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Selection Mode</label>
                <select id="group-mode" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="single_required">Single — required (pick one)</option>
                    <option value="single_optional">Single — optional (pick zero or one)</option>
                    <option value="multi">Multi (pick any)</option>
                </select>
            </div>
        </div>
        <div class="flex justify-end gap-2 mt-5">
            <button onclick="closeGroupModal()" class="px-4 py-2 text-sm rounded border hover:bg-gray-50">Cancel</button>
            <button onclick="saveGroup()" class="px-4 py-2 text-sm rounded bg-blue-600 text-white hover:bg-blue-700">Save</button>
        </div>
    </div>
</div>

<!-- Option Modal -->
<div id="option-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-96 p-6">
        <h3 class="font-bold text-lg mb-4" id="option-modal-title">Add Option</h3>
        <div class="space-y-3">
            <div>
                <label class="block text-sm text-gray-600 mb-1">Name</label>
                <input id="option-name" type="text" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Price Delta (THB) <span class="text-gray-400">— 0 for no extra cost</span></label>
                <input id="option-price" type="number" step="0.01" value="0" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
        <div class="flex justify-end gap-2 mt-5">
            <button onclick="closeOptionModal()" class="px-4 py-2 text-sm rounded border hover:bg-gray-50">Cancel</button>
            <button onclick="saveOption()" class="px-4 py-2 text-sm rounded bg-blue-600 text-white hover:bg-blue-700">Save</button>
        </div>
    </div>
</div>

<script>
const unwrap = r => r.json().then(d => d.data ?? d);

let groups = [];
let groupEditId = null;
let optionEditId = null;
let optionGroupCtx = null;

async function load() {
    groups = await fetch('/api/option-groups').then(unwrap);
    render();
}

function modeLabel(m) {
    return ({
        single_required: 'Single (required)',
        single_optional: 'Single (optional)',
        multi: 'Multi',
    })[m] || m;
}

function render() {
    const el = document.getElementById('group-list');
    if (!groups.length) {
        el.innerHTML = '<p class="p-6 text-sm text-gray-400">No option groups yet.</p>';
        return;
    }
    el.innerHTML = groups.map(g => `
        <div class="px-6 py-4">
            <div class="flex items-center justify-between mb-2">
                <div>
                    <p class="text-sm font-bold">${esc(g.name)}</p>
                    <p class="text-xs text-gray-400">${modeLabel(g.selection_mode)}</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="openOptionModal(${g.id})" class="text-xs text-blue-600 hover:underline">+ Add Option</button>
                    <button onclick="openGroupModal(${g.id})" class="text-xs text-blue-600 hover:underline">Edit</button>
                    <button onclick="deleteGroup(${g.id})" class="text-xs text-red-500 hover:underline">Delete</button>
                </div>
            </div>
            <div class="ml-4 mt-2 space-y-1">
                ${(g.options || []).map(o => `
                    <div class="flex items-center justify-between text-sm py-1">
                        <span>${esc(o.name)} <span class="text-gray-400">${o.price_delta > 0 ? '+฿' + o.price_delta.toFixed(2) : (o.price_delta < 0 ? '−฿' + Math.abs(o.price_delta).toFixed(2) : 'free')}</span></span>
                        <div class="flex gap-2">
                            <button onclick="openOptionModal(${g.id}, ${o.id})" class="text-xs text-blue-600 hover:underline">Edit</button>
                            <button onclick="deleteOption(${o.id})" class="text-xs text-red-500 hover:underline">Delete</button>
                        </div>
                    </div>
                `).join('') || '<p class="text-xs text-gray-400">No options yet.</p>'}
            </div>
        </div>
    `).join('');
}

// Group modal
function openGroupModal(id) {
    groupEditId = id || null;
    const g = id ? groups.find(x => x.id === id) : null;
    document.getElementById('group-modal-title').textContent = id ? 'Edit Option Group' : 'Add Option Group';
    document.getElementById('group-name').value = g ? g.name : '';
    document.getElementById('group-mode').value = g ? g.selection_mode : 'single_required';
    document.getElementById('group-modal').classList.remove('hidden');
    document.getElementById('group-name').focus();
}
function closeGroupModal() {
    document.getElementById('group-modal').classList.add('hidden');
    groupEditId = null;
}
async function saveGroup() {
    const name = document.getElementById('group-name').value.trim();
    const mode = document.getElementById('group-mode').value;
    if (!name) return;
    const body = JSON.stringify({ name, selection_mode: mode });
    const url = groupEditId ? `/api/option-groups/${groupEditId}` : '/api/option-groups';
    const method = groupEditId ? 'PATCH' : 'POST';
    await fetch(url, { method, headers: {'Content-Type':'application/json'}, body });
    closeGroupModal();
    await load();
}
async function deleteGroup(id) {
    if (!confirm('Delete this option group? All options in it will be removed.')) return;
    await fetch(`/api/option-groups/${id}`, { method: 'DELETE' });
    await load();
}

// Option modal
function openOptionModal(groupId, optionId) {
    optionGroupCtx = groupId;
    optionEditId = optionId || null;
    let o = null;
    if (optionId) {
        const g = groups.find(x => x.id === groupId);
        o = g && (g.options || []).find(x => x.id === optionId);
    }
    document.getElementById('option-modal-title').textContent = optionId ? 'Edit Option' : 'Add Option';
    document.getElementById('option-name').value = o ? o.name : '';
    document.getElementById('option-price').value = o ? o.price_delta : 0;
    document.getElementById('option-modal').classList.remove('hidden');
    document.getElementById('option-name').focus();
}
function closeOptionModal() {
    document.getElementById('option-modal').classList.add('hidden');
    optionEditId = null;
    optionGroupCtx = null;
}
async function saveOption() {
    const name = document.getElementById('option-name').value.trim();
    const priceDelta = parseFloat(document.getElementById('option-price').value) || 0;
    if (!name) return;
    const body = JSON.stringify({ name, price_delta: priceDelta, sort_order: 0 });
    if (optionEditId) {
        await fetch(`/api/options/${optionEditId}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body });
    } else {
        await fetch(`/api/option-groups/${optionGroupCtx}/options`, { method: 'POST', headers: {'Content-Type':'application/json'}, body });
    }
    closeOptionModal();
    await load();
}
async function deleteOption(id) {
    if (!confirm('Delete this option?')) return;
    await fetch(`/api/options/${id}`, { method: 'DELETE' });
    await load();
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeGroupModal(); closeOptionModal(); }
    if (e.key === 'Enter') {
        if (!document.getElementById('group-modal').classList.contains('hidden')) saveGroup();
        else if (!document.getElementById('option-modal').classList.contains('hidden')) saveOption();
    }
});

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
</script>
{{end}}
