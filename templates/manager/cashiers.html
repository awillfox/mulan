{{template "title" .}}
{{define "title"}}Cashiers{{end}}

{{define "content"}}
<div class="max-w-2xl space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-gray-900">Cashiers</h1>
        <button onclick="openAdd()"
                class="px-4 py-2 text-sm rounded bg-blue-600 text-white hover:bg-blue-700">
            + Add Cashier
        </button>
    </div>

    <div id="cashier-list" class="bg-white rounded-lg shadow divide-y divide-gray-100"></div>
</div>

<!-- Add / Edit modal -->
<div id="modal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 space-y-4">
        <h2 id="modal-title" class="text-lg font-bold">Add Cashier</h2>

        <div id="modal-login-id-row">
            <label class="block text-sm text-gray-600 mb-1">Login ID <span class="text-gray-400">(numeric, shown on numpad)</span></label>
            <input id="modal-login-id" type="text" maxlength="20" placeholder="e.g. 101"
                   class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm text-gray-600 mb-1">Name</label>
            <input id="modal-name" type="text" maxlength="255" placeholder="Cashier name"
                   class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div id="modal-pin-row">
            <label class="block text-sm text-gray-600 mb-1">PIN <span id="modal-pin-label" class="text-gray-400">(min 4 digits)</span></label>
            <input id="modal-pin" type="password" inputmode="numeric" maxlength="20" placeholder="••••"
                   class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div id="modal-active-row" class="hidden flex items-center gap-2">
            <input id="modal-active" type="checkbox" checked class="w-4 h-4 accent-blue-600">
            <label for="modal-active" class="text-sm text-gray-600">Active</label>
        </div>

        <p id="modal-err" class="text-sm text-red-500 hidden"></p>

        <div class="flex gap-3 pt-1">
            <button onclick="closeModal()"
                    class="flex-1 px-4 py-2 text-sm border border-gray-300 rounded hover:bg-gray-50">Cancel</button>
            <button id="modal-save" onclick="saveModal()"
                    class="flex-1 px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
        </div>
    </div>
</div>

<!-- Change PIN modal -->
<div id="pin-modal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 space-y-4">
        <h2 class="text-lg font-bold">Change PIN</h2>
        <p id="pin-modal-name" class="text-sm text-gray-500"></p>
        <input id="pin-modal-pin" type="password" inputmode="numeric" maxlength="20" placeholder="New PIN (min 4 digits)"
               class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <p id="pin-modal-err" class="text-sm text-red-500 hidden"></p>
        <div class="flex gap-3 pt-1">
            <button onclick="closePinModal()"
                    class="flex-1 px-4 py-2 text-sm border border-gray-300 rounded hover:bg-gray-50">Cancel</button>
            <button onclick="savePinModal()"
                    class="flex-1 px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">Save PIN</button>
        </div>
    </div>
</div>

<script>
const API = '/api/cashiers';
const unwrap = r => r.json().then(d => d.data ?? d);

let cashiers = [];
let editingID = null;
let pinTargetID = null;

async function load() {
    const r = await fetch(API);
    if (!r.ok) return;
    cashiers = await unwrap(r);
    render();
}

function render() {
    const el = document.getElementById('cashier-list');
    if (!cashiers.length) {
        el.innerHTML = '<p class="p-6 text-sm text-gray-400">No cashiers yet.</p>';
        return;
    }
    el.innerHTML = cashiers.map(c => `
        <div class="flex items-center justify-between px-5 py-4 gap-3">
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2">
                    <span class="font-mono font-semibold text-blue-700">${esc(c.login_id)}</span>
                    <span class="font-medium text-gray-800">${esc(c.name)}</span>
                    ${c.active ? '' : '<span class="text-xs px-2 py-0.5 bg-gray-100 text-gray-500 rounded-full">Inactive</span>'}
                </div>
            </div>
            <div class="flex gap-2 flex-shrink-0">
                <button onclick="openPin(${c.id},'${esc(c.name)}')"
                        class="px-3 py-1.5 text-xs border border-gray-300 rounded hover:bg-gray-50">PIN</button>
                <button onclick="openEdit(${c.id})"
                        class="px-3 py-1.5 text-xs border border-gray-300 rounded hover:bg-gray-50">Edit</button>
                <button onclick="del(${c.id})"
                        class="px-3 py-1.5 text-xs border border-red-200 text-red-600 rounded hover:bg-red-50">Delete</button>
            </div>
        </div>
    `).join('');
}

function esc(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function openAdd() {
    editingID = null;
    document.getElementById('modal-title').textContent = 'Add Cashier';
    document.getElementById('modal-login-id-row').style.display = '';
    document.getElementById('modal-login-id').value = '';
    document.getElementById('modal-name').value = '';
    document.getElementById('modal-pin').value = '';
    document.getElementById('modal-pin-label').textContent = '(min 4 digits)';
    document.getElementById('modal-active-row').classList.add('hidden');
    document.getElementById('modal-err').classList.add('hidden');
    document.getElementById('modal').classList.remove('hidden');
    setTimeout(() => document.getElementById('modal-login-id').focus(), 50);
}

function openEdit(id) {
    const c = cashiers.find(x => x.id === id);
    if (!c) return;
    editingID = id;
    document.getElementById('modal-title').textContent = 'Edit Cashier';
    document.getElementById('modal-login-id-row').style.display = 'none';
    document.getElementById('modal-name').value = c.name;
    document.getElementById('modal-pin').value = '';
    document.getElementById('modal-pin-label').textContent = '(leave blank to keep current)';
    document.getElementById('modal-active').checked = c.active;
    document.getElementById('modal-active-row').classList.remove('hidden');
    document.getElementById('modal-err').classList.add('hidden');
    document.getElementById('modal').classList.remove('hidden');
    setTimeout(() => document.getElementById('modal-name').focus(), 50);
}

function closeModal() { document.getElementById('modal').classList.add('hidden'); }

async function saveModal() {
    const name = document.getElementById('modal-name').value.trim();
    const pin  = document.getElementById('modal-pin').value;
    const errEl = document.getElementById('modal-err');
    errEl.classList.add('hidden');

    if (!name) { showErr(errEl, 'Name is required'); return; }

    let r;
    if (!editingID) {
        const login_id = document.getElementById('modal-login-id').value.trim();
        if (!login_id) { showErr(errEl, 'Login ID is required'); return; }
        if (pin.length < 4) { showErr(errEl, 'PIN must be at least 4 digits'); return; }
        r = await fetch(API, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ login_id, name, pin }),
        });
    } else {
        const body = { name, active: document.getElementById('modal-active').checked };
        r = await fetch(`${API}/${editingID}`, {
            method: 'PATCH', headers: {'Content-Type':'application/json'},
            body: JSON.stringify(body),
        });
        if (r.ok && pin.length >= 4) {
            await fetch(`${API}/${editingID}/pin`, {
                method: 'PATCH', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ pin }),
            });
        }
    }

    if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        showErr(errEl, d.error || 'Save failed'); return;
    }
    closeModal();
    load();
}

function openPin(id, name) {
    pinTargetID = id;
    document.getElementById('pin-modal-name').textContent = name;
    document.getElementById('pin-modal-pin').value = '';
    document.getElementById('pin-modal-err').classList.add('hidden');
    document.getElementById('pin-modal').classList.remove('hidden');
    setTimeout(() => document.getElementById('pin-modal-pin').focus(), 50);
}

function closePinModal() { document.getElementById('pin-modal').classList.add('hidden'); }

async function savePinModal() {
    const pin = document.getElementById('pin-modal-pin').value;
    const errEl = document.getElementById('pin-modal-err');
    if (pin.length < 4) { showErr(errEl, 'PIN must be at least 4 digits'); return; }
    const r = await fetch(`${API}/${pinTargetID}/pin`, {
        method: 'PATCH', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ pin }),
    });
    if (!r.ok) { showErr(errEl, 'Failed to update PIN'); return; }
    closePinModal();
}

async function del(id) {
    const c = cashiers.find(x => x.id === id);
    if (!confirm(`Delete cashier "${c?.name}"?`)) return;
    await fetch(`${API}/${id}`, { method: 'DELETE' });
    load();
}

function showErr(el, msg) {
    el.textContent = msg;
    el.classList.remove('hidden');
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closePinModal(); }
});

load();
</script>
{{end}}
