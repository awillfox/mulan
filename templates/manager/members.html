{{template "title" .}}
{{define "title"}}Members{{end}}

{{define "content"}}
<div class="max-w-3xl mx-auto">
    <div class="bg-white rounded-lg shadow">
        <div class="p-6 border-b flex items-center justify-between gap-4">
            <h2 class="text-lg font-bold whitespace-nowrap">Members</h2>
            <div class="flex items-center gap-2 flex-1 justify-end">
                <input id="search" type="text" placeholder="Search phone or name…" oninput="onSearch()"
                       class="w-full max-w-xs border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="openMemberModal()" class="bg-blue-600 text-white text-sm px-3 py-1.5 rounded hover:bg-blue-700 whitespace-nowrap">+ Add</button>
            </div>
        </div>
        <div class="divide-y" id="member-list"></div>
    </div>
</div>

<!-- ── Member Modal ── -->
<div id="member-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-80 p-6">
        <h3 class="font-bold text-lg mb-4" id="member-modal-title">Add Member</h3>
        <div class="space-y-3">
            <div>
                <label class="block text-sm text-gray-600 mb-1">Phone</label>
                <input id="member-phone" type="tel" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Name <span class="text-gray-400">(optional)</span></label>
                <input id="member-name" type="text" maxlength="255" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
        <div class="flex justify-end gap-2 mt-5">
            <button onclick="closeMemberModal()" class="px-4 py-2 text-sm rounded border hover:bg-gray-50">Cancel</button>
            <button onclick="saveMember()" class="px-4 py-2 text-sm rounded bg-blue-600 text-white hover:bg-blue-700">Save</button>
        </div>
    </div>
</div>

<!-- ── Order History Modal ── -->
<div id="orders-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-96 p-6">
        <h3 class="font-bold text-lg mb-1">Order History</h3>
        <p class="text-sm text-gray-500 mb-4" id="orders-modal-sub"></p>
        <div class="max-h-80 overflow-y-auto divide-y" id="orders-list"></div>
        <div class="flex justify-end mt-5">
            <button onclick="closeOrdersModal()" class="px-4 py-2 text-sm rounded border hover:bg-gray-50">Close</button>
        </div>
    </div>
</div>

<script>
const unwrap = r => r.json().then(d => d.data ?? d);

let members = [];
let memberEditId = null;
let searchTimer = null;

// ── Load ──────────────────────────────────────────────
async function load() {
    const q = document.getElementById('search').value.trim();
    const url = q ? `/api/members?q=${encodeURIComponent(q)}` : '/api/members';
    members = await fetch(url).then(unwrap);
    renderMembers();
}

function onSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(load, 200);
}

function renderMembers() {
    const el = document.getElementById('member-list');
    if (!members.length) {
        el.innerHTML = '<p class="p-6 text-sm text-gray-400">No members found.</p>';
        return;
    }
    el.innerHTML = members.map(m => `
        <div class="flex items-center justify-between px-6 py-3">
            <div>
                <p class="text-sm font-medium">${m.name ? esc(m.name) : '<span class="text-gray-400">(no name)</span>'}</p>
                <p class="text-xs text-gray-400">${esc(m.phone)} · ${m.points} pts</p>
            </div>
            <div class="flex gap-2">
                <button onclick="openOrders(${m.id})" class="text-xs text-gray-600 hover:underline">Orders</button>
                <button onclick="openMemberModal(${m.id})" class="text-xs text-blue-600 hover:underline">Edit</button>
                <button onclick="deleteMember(${m.id})" class="text-xs text-red-500 hover:underline">Delete</button>
            </div>
        </div>
    `).join('');
}

// ── Add / Edit ────────────────────────────────────────
function openMemberModal(id) {
    memberEditId = id || null;
    const m = id ? members.find(x => x.id === id) : null;
    document.getElementById('member-modal-title').textContent = id ? 'Edit Member' : 'Add Member';
    document.getElementById('member-phone').value = m ? m.phone : '';
    document.getElementById('member-name').value  = m && m.name ? m.name : '';
    document.getElementById('member-modal').classList.remove('hidden');
    document.getElementById('member-phone').focus();
}
function closeMemberModal() {
    document.getElementById('member-modal').classList.add('hidden');
    memberEditId = null;
}

async function saveMember() {
    const phone = document.getElementById('member-phone').value.trim();
    const name  = document.getElementById('member-name').value.trim();
    if (!phone) return;
    const body = JSON.stringify({ phone, name });
    const r = memberEditId
        ? await fetch(`/api/members/${memberEditId}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body })
        : await fetch('/api/members', { method: 'POST', headers: {'Content-Type':'application/json'}, body });
    if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        alert(d.error || 'Save failed');
        return;
    }
    closeMemberModal();
    await load();
}

async function deleteMember(id) {
    if (!confirm('Delete this member? Their past orders are kept but unlinked.')) return;
    await fetch(`/api/members/${id}`, { method: 'DELETE' });
    await load();
}

// ── Order History ─────────────────────────────────────
async function openOrders(id) {
    const m = members.find(x => x.id === id);
    document.getElementById('orders-modal-sub').textContent =
        [m && m.name, m && m.phone, m ? m.points + ' pts' : null].filter(Boolean).join(' · ');
    const list = document.getElementById('orders-list');
    list.innerHTML = '<p class="py-4 text-sm text-gray-400">Loading…</p>';
    document.getElementById('orders-modal').classList.remove('hidden');
    const orders = await fetch(`/api/members/${id}/orders`).then(unwrap);
    if (!orders.length) {
        list.innerHTML = '<p class="py-4 text-sm text-gray-400">No orders yet.</p>';
        return;
    }
    list.innerHTML = orders.map(o => `
        <div class="flex items-center justify-between py-2">
            <div>
                <p class="text-sm font-medium">${esc(o.code)}</p>
                <p class="text-xs text-gray-400">${fmtDate(o.created_at)}</p>
            </div>
            <div class="text-right">
                <p class="text-sm">฿${o.subtotal.toFixed(2)}</p>
                <p class="text-xs text-green-600">+${o.points_earned} pts</p>
            </div>
        </div>
    `).join('');
}
function closeOrdersModal() {
    document.getElementById('orders-modal').classList.add('hidden');
}

function fmtDate(s) {
    if (!s) return '';
    const d = new Date(s);
    return isNaN(d) ? esc(s) : d.toLocaleString();
}

// ── Keyboard shortcuts ────────────────────────────────
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeMemberModal(); closeOrdersModal(); }
    if (e.key === 'Enter' && !document.getElementById('member-modal').classList.contains('hidden')) saveMember();
});

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
</script>
{{end}}
