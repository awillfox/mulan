{{template "title" .}}
{{define "title"}}Dashboard{{end}}

{{define "content"}}
<!-- Summary widgets -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-sm font-medium text-gray-500">Today's Sales</h3>
        <p class="text-3xl font-bold text-gray-900 mt-2" id="today-sales">-</p>
    </div>
    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-sm font-medium text-gray-500">Orders Today</h3>
        <p class="text-3xl font-bold text-gray-900 mt-2" id="today-orders">-</p>
    </div>
    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-sm font-medium text-gray-500">Menu Items</h3>
        <p class="text-3xl font-bold text-gray-900 mt-2" id="menu-count">-</p>
    </div>
</div>

<!-- Top 5 best selling -->
<div class="bg-white rounded-lg shadow">
    <div class="p-6 border-b flex flex-wrap items-center gap-4">
        <h2 class="text-lg font-bold flex-1">Top 10 Best Selling</h2>
        <div class="flex items-center gap-2 text-sm">
            <label class="text-gray-500">From</label>
            <input type="date" id="filter-from" class="border rounded px-2 py-1 text-gray-700">
            <label class="text-gray-500">To</label>
            <input type="date" id="filter-to" class="border rounded px-2 py-1 text-gray-700">
            <button onclick="loadTopMenus()" class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">Apply</button>
        </div>
    </div>
    <div class="p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Table -->
        <div>
            <table class="w-full text-sm">
                <thead>
                    <tr class="text-left text-gray-500 border-b">
                        <th class="pb-2 font-medium">#</th>
                        <th class="pb-2 font-medium">Menu</th>
                        <th class="pb-2 font-medium text-right">Qty Sold</th>
                        <th class="pb-2 font-medium text-right">Revenue</th>
                    </tr>
                </thead>
                <tbody id="top-menus-table"></tbody>
            </table>
            <p id="top-menus-empty" class="text-gray-400 text-sm mt-4 hidden">No sales data for this period.</p>
        </div>
        <!-- Pie chart -->
        <div class="flex items-center justify-center">
            <canvas id="top-menus-chart" width="260" height="260"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script>
const COLORS = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16'];
let chart = null;

function todayStr() {
    return new Date().toISOString().slice(0, 10);
}

async function loadSummary() {
    const [menuRes, dashRes] = await Promise.all([
        fetch('/api/menus'),
        fetch('/api/dashboard'),
    ]);
    const menus = await menuRes.json();
    const dash = await dashRes.json();
    document.getElementById('menu-count').textContent = menus.length;
    document.getElementById('today-sales').textContent = '฿' + dash.sales.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    document.getElementById('today-orders').textContent = dash.orders;
}

async function loadTopMenus() {
    const from = document.getElementById('filter-from').value;
    const to   = document.getElementById('filter-to').value;
    const params = new URLSearchParams();
    if (from) params.set('from', from);
    if (to)   params.set('to', to);

    const res = await fetch('/api/dashboard/top-menus?' + params);
    const items = await res.json();

    const tbody = document.getElementById('top-menus-table');
    const empty = document.getElementById('top-menus-empty');

    if (!items || items.length === 0) {
        tbody.innerHTML = '';
        empty.classList.remove('hidden');
    } else {
        empty.classList.add('hidden');
        tbody.innerHTML = items.map((item, i) => `
            <tr class="border-b last:border-0">
                <td class="py-2 text-gray-400">${i + 1}</td>
                <td class="py-2 font-medium flex items-center gap-2">
                    <span class="inline-block w-3 h-3 rounded-full" style="background:${COLORS[i]}"></span>
                    ${item.name}
                </td>
                <td class="py-2 text-right text-gray-700">${item.qty_sold}</td>
                <td class="py-2 text-right text-blue-600 font-medium">฿${item.revenue.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            </tr>
        `).join('');
    }

    renderChart(items || []);
}

function renderChart(items) {
    const ctx = document.getElementById('top-menus-chart').getContext('2d');
    if (chart) chart.destroy();
    if (items.length === 0) return;

    chart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: items.map(i => i.name),
            datasets: [{
                data: items.map(i => i.qty_sold),
                backgroundColor: COLORS.slice(0, items.length),
                borderWidth: 2,
            }]
        },
        options: {
            plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 12 } } },
                tooltip: {
                    callbacks: {
                        label: ctx => ` ${ctx.label}: ${ctx.parsed} sold`
                    }
                }
            }
        }
    });
}

// Init: set default date range to today
document.getElementById('filter-from').value = todayStr();
document.getElementById('filter-to').value   = todayStr();

loadSummary();
loadTopMenus();
</script>
{{end}}
