<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{template "title" .}} - Mulan Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-bold text-gray-900">Mulan Manager</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/manager" class="text-gray-700 hover:text-gray-900 px-3 py-2 text-sm font-medium">Report</a>
                    <a href="/manager/items" class="text-gray-700 hover:text-gray-900 px-3 py-2 text-sm font-medium">Item Manager</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {{template "content" .}}
    </main>
</body>
</html>
