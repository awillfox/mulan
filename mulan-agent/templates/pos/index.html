{{template "title" .}}
{{define "title"}}POS{{end}}

{{define "content"}}
<div class="relative flex flex-col md:flex-row h-screen w-screen overflow-hidden">
    <!-- Left: Menu Items -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- Category Tabs -->
        <div class="flex bg-white border-b px-2 pt-2 gap-1 flex-shrink-0" id="category-tabs">
            <button class="px-4 py-2 text-sm font-medium bg-blue-500 text-white rounded-t" onclick="filterCategory(null)">All</button>
        </div>

        <!-- Menu Grid — fills remaining height, no scroll -->
        <div class="flex-1 p-3 min-h-0">
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 grid-rows-4 gap-2 h-full" id="menu-grid"></div>
        </div>

        <!-- Menu Pagination -->
        <div class="flex items-center justify-between px-4 py-2 border-t bg-white flex-shrink-0">
            <button id="menu-prev" onclick="menuPrev()"
                class="px-8 py-2 bg-gray-200 text-gray-800 rounded-lg font-bold text-lg hover:bg-gray-300 active:bg-gray-400 disabled:opacity-30 disabled:pointer-events-none">
                ◀ Prev
            </button>
            <span id="menu-page-info" class="text-sm text-gray-500 font-medium"></span>
            <button id="menu-next" onclick="menuNext()"
                class="px-8 py-2 bg-gray-200 text-gray-800 rounded-lg font-bold text-lg hover:bg-gray-300 active:bg-gray-400 disabled:opacity-30 disabled:pointer-events-none">
                Next ▶
            </button>
        </div>
    </div>

    <!-- Right: Order Summary -->
    <div class="w-full md:w-80 lg:w-96 max-h-[40vh] md:max-h-none bg-white border-t md:border-t-0 md:border-l flex flex-col">
        <div class="p-3 border-b flex-shrink-0 flex items-center justify-between">
            <h2 class="text-lg font-bold">Order</h2>
            <button onclick="openSettings()"
                class="w-9 h-9 flex items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100 active:bg-gray-200 text-xl">
                ⚙
            </button>
        </div>

        <!-- Options Modal -->
        <div id="options-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] flex flex-col">
                <div class="p-4 border-b flex items-center justify-between">
                    <h3 id="options-title" class="text-lg font-bold"></h3>
                    <button onclick="closeOptionsModal()" class="text-gray-400 text-2xl leading-none">&times;</button>
                </div>
                <div id="options-body" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
                <div class="p-4 border-t flex gap-2">
                    <button onclick="closeOptionsModal()" class="flex-1 py-3 bg-gray-200 text-gray-800 rounded-xl font-bold hover:bg-gray-300 active:bg-gray-400">Cancel</button>
                    <button id="options-confirm" onclick="confirmOptions()" class="flex-1 py-3 bg-blue-500 text-white rounded-xl font-bold hover:bg-blue-600 active:bg-blue-700">Add</button>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="hidden absolute inset-0 bg-black/50 flex items-center justify-center z-50">
            <div class="bg-white rounded-2xl shadow-xl p-6 w-64 flex flex-col gap-4">
                <h3 class="text-lg font-bold text-center">Settings</h3>
                <button onclick="toggleFullscreen()"
                    id="fullscreen-btn"
                    class="w-full py-4 bg-blue-500 text-white rounded-xl font-bold text-base hover:bg-blue-600 active:bg-blue-700">
                    Enter Full Screen
                </button>
                <button onclick="closeSettings()"
                    class="w-full py-3 bg-gray-200 text-gray-800 rounded-xl font-bold text-base hover:bg-gray-300 active:bg-gray-400">
                    Close
                </button>
            </div>
        </div>

        <!-- Order Items — no scroll -->
        <div class="flex-1 px-3 pt-2 min-h-0" id="order-items"></div>

        <!-- Order Pagination (shown only when order exceeds one page) -->
        <div id="order-pagination" class="hidden flex-shrink-0 flex items-center justify-between px-3 py-2 border-t">
            <button id="order-prev" onclick="orderPrev()"
                class="px-5 py-2 bg-gray-200 text-gray-800 rounded-lg font-bold hover:bg-gray-300 active:bg-gray-400 disabled:opacity-30 disabled:pointer-events-none">
                ◀
            </button>
            <span id="order-page-info" class="text-xs text-gray-500"></span>
            <button id="order-next" onclick="orderNext()"
                class="px-5 py-2 bg-gray-200 text-gray-800 rounded-lg font-bold hover:bg-gray-300 active:bg-gray-400 disabled:opacity-30 disabled:pointer-events-none">
                ▶
            </button>
        </div>

        <!-- Total + Pay -->
        <div class="border-t p-3 flex-shrink-0">
            <div class="flex justify-between text-lg font-bold mb-3">
                <span>Total</span>
                <span id="order-total">฿0.00</span>
            </div>
            <button class="w-full bg-green-500 text-white py-3 rounded text-lg font-bold hover:bg-green-600 active:bg-green-700" onclick="checkout()">Pay</button>
        </div>
    </div>
</div>

<script>
const API_BASE = "{{.APIBase}}";
const MENU_PAGE_SIZE = 16;
const ORDER_PAGE_SIZE = 8;

let menus = [];
let categories = [];
let order = [];
let orderCode = null;
let activeCategory = null;
let menuPage = 0;
let orderPage = 0;

const unwrap = r => r.json().then(d => d.data ?? d);

async function init() {
    [menus, categories] = await Promise.all([
        fetch(API_BASE + '/api/menus').then(unwrap),
        fetch(API_BASE + '/api/menu-categories').then(unwrap),
    ]);
    renderCategories();
    renderMenus();
}

function renderCategories() {
    const tabs = document.getElementById('category-tabs');
    tabs.innerHTML = '<button class="px-4 py-2 text-sm font-medium bg-blue-500 text-white rounded-t" onclick="filterCategory(null)">All</button>';
    categories.forEach(c => {
        tabs.innerHTML += `<button class="px-4 py-2 text-sm font-medium bg-gray-200 text-gray-700 rounded-t hover:bg-gray-300" onclick="filterCategory(${c.id})">${c.name}</button>`;
    });
}

function filterCategory(id) {
    activeCategory = id;
    menuPage = 0;
    document.querySelectorAll('#category-tabs button').forEach((btn, i) => {
        const active = (id === null && i === 0) || (id !== null && i > 0 && categories[i - 1].id === id);
        btn.className = active
            ? 'px-4 py-2 text-sm font-medium bg-blue-500 text-white rounded-t'
            : 'px-4 py-2 text-sm font-medium bg-gray-200 text-gray-700 rounded-t hover:bg-gray-300';
    });
    renderMenus();
}

function filteredMenus() {
    return activeCategory === null ? menus : menus.filter(m => m.category_id === activeCategory);
}

function renderMenus() {
    const all = filteredMenus();
    const totalPages = Math.max(1, Math.ceil(all.length / MENU_PAGE_SIZE));
    if (menuPage >= totalPages) menuPage = totalPages - 1;

    const page = all.slice(menuPage * MENU_PAGE_SIZE, (menuPage + 1) * MENU_PAGE_SIZE);

    document.getElementById('menu-grid').innerHTML = page.map(m => m.active
        ? `<button data-menu-id="${m.id}" onclick="addToOrder(${m.id})"
            class="w-full h-full bg-white border-2 rounded-xl flex flex-col items-center justify-center hover:bg-blue-50 active:bg-blue-100">
            <div class="font-bold text-base px-1 text-center leading-tight">${m.name}</div>
            <div class="text-blue-600 font-medium text-sm mt-1">฿${m.price.toFixed(2)}</div>
        </button>`
        : `<button data-menu-id="${m.id}" disabled
            class="w-full h-full bg-gray-100 border-2 border-gray-200 rounded-xl flex flex-col items-center justify-center opacity-50 cursor-not-allowed">
            <div class="font-bold text-base px-1 text-center leading-tight text-gray-400">${m.name}</div>
            <div class="text-gray-400 font-medium text-sm mt-1">Unavailable</div>
        </button>`
    ).join('');

    document.getElementById('menu-page-info').textContent = `${menuPage + 1} / ${totalPages}`;
    document.getElementById('menu-prev').disabled = menuPage === 0;
    document.getElementById('menu-next').disabled = menuPage >= totalPages - 1;
}

function menuPrev() { if (menuPage > 0) { menuPage--; renderMenus(); } }
function menuNext() {
    if (menuPage < Math.ceil(filteredMenus().length / MENU_PAGE_SIZE) - 1) { menuPage++; renderMenus(); }
}

function lineKey(menuId, options) {
    const ids = (options || []).map(o => o.id).sort((a, b) => a - b).join(',');
    return menuId + '|' + ids;
}

function unitPrice(line) {
    return line.price + (line.options || []).reduce((s, o) => s + (o.price_delta || 0), 0);
}

async function addToOrder(menuId) {
    const menu = menus.find(m => m.id === menuId);
    if (!menu) return;
    if (menu.option_groups && menu.option_groups.length > 0) {
        openOptionsModal(menu);
        return;
    }
    await addLine(menu, []);
}

async function addLine(menu, selectedOptions) {
    if (!orderCode) {
        const res = await fetch(API_BASE + '/api/orders', { method: 'POST' });
        const data = await res.json();
        orderCode = (data.data && data.data.code) || data.code;
    }
    const key = lineKey(menu.id, selectedOptions);
    const existing = order.find(o => o.key === key);
    if (existing) {
        existing.qty++;
    } else {
        order.push({
            key,
            id: menu.id,
            name: menu.name,
            price: menu.price,
            qty: 1,
            options: selectedOptions,
        });
    }
    renderOrder();

    const line = order.find(o => o.key === key);
    fetch('/vfd/item', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: menu.vfd_name || menu.name, qty: line.qty, total: unitPrice(line) * line.qty }),
    });
}

function removeFromOrder(key) {
    const idx = order.findIndex(o => o.key === key);
    if (idx !== -1) {
        order[idx].qty--;
        if (order[idx].qty <= 0) order.splice(idx, 1);
    }
    renderOrder();
}

function renderOrder() {
    const totalPages = Math.max(1, Math.ceil(order.length / ORDER_PAGE_SIZE));
    if (orderPage >= totalPages) orderPage = totalPages - 1;

    const page = order.slice(orderPage * ORDER_PAGE_SIZE, (orderPage + 1) * ORDER_PAGE_SIZE);

    document.getElementById('order-items').innerHTML = page.map(o => {
        const u = unitPrice(o);
        const optsHTML = (o.options || []).map(op => `
            <div class="text-xs text-gray-500 pl-2">
                · ${op.name}${op.price_delta > 0 ? ` <span class="text-gray-400">(+฿${op.price_delta.toFixed(2)})</span>` : ''}
            </div>
        `).join('');
        return `
        <div class="flex items-start py-2 border-b gap-2">
            <div class="flex-1 min-w-0">
                <div class="text-sm font-medium truncate">${o.name}</div>
                ${optsHTML}
                <div class="text-xs text-gray-500 mt-0.5">฿${u.toFixed(2)} x ${o.qty}</div>
            </div>
            <span class="text-sm font-semibold flex-shrink-0">฿${(u * o.qty).toFixed(2)}</span>
            <button onclick="removeFromOrder('${o.key}')"
                class="w-10 h-10 flex-shrink-0 bg-red-100 text-red-600 rounded-lg flex items-center justify-center text-lg font-bold hover:bg-red-200 active:bg-red-300">
                ✕
            </button>
        </div>`;
    }).join('');

    const total = order.reduce((sum, o) => sum + unitPrice(o) * o.qty, 0);
    document.getElementById('order-total').textContent = `฿${total.toFixed(2)}`;

    const pagination = document.getElementById('order-pagination');
    if (order.length > ORDER_PAGE_SIZE) {
        pagination.classList.remove('hidden');
        document.getElementById('order-page-info').textContent = `${orderPage + 1} / ${totalPages}`;
        document.getElementById('order-prev').disabled = orderPage === 0;
        document.getElementById('order-next').disabled = orderPage >= totalPages - 1;
    } else {
        pagination.classList.add('hidden');
    }
}

// ── Options modal ─────────────────────────────────────────────────────
let pendingMenu = null;

function openOptionsModal(menu) {
    pendingMenu = menu;
    document.getElementById('options-title').textContent = menu.name;
    const body = document.getElementById('options-body');
    body.innerHTML = (menu.option_groups || []).map(g => {
        const isMulti = g.selection_mode === 'multi';
        const required = g.selection_mode === 'single_required';
        const inputType = isMulti ? 'checkbox' : 'radio';
        return `
            <div data-group-id="${g.id}" data-mode="${g.selection_mode}">
                <div class="flex items-baseline justify-between mb-2">
                    <h4 class="font-bold text-base">${g.name}</h4>
                    <span class="text-xs text-gray-500">${required ? 'Required' : (isMulti ? 'Pick any' : 'Optional')}</span>
                </div>
                <div class="space-y-2">
                    ${(g.options || []).map(o => `
                        <label class="flex items-center gap-3 px-3 py-3 border rounded-xl cursor-pointer hover:bg-gray-50">
                            <input type="${inputType}" name="grp-${g.id}" value="${o.id}" data-name="${o.name}" data-delta="${o.price_delta}" class="w-5 h-5">
                            <span class="flex-1 text-sm font-medium">${o.name}</span>
                            <span class="text-sm text-gray-500">${o.price_delta > 0 ? '+฿' + o.price_delta.toFixed(2) : (o.price_delta < 0 ? '−฿' + Math.abs(o.price_delta).toFixed(2) : '')}</span>
                        </label>
                    `).join('')}
                </div>
            </div>
        `;
    }).join('');
    document.getElementById('options-modal').classList.remove('hidden');
}

function closeOptionsModal() {
    document.getElementById('options-modal').classList.add('hidden');
    pendingMenu = null;
}

function confirmOptions() {
    if (!pendingMenu) return;
    const groupBlocks = document.querySelectorAll('#options-body [data-group-id]');
    const selected = [];
    for (const block of groupBlocks) {
        const mode = block.dataset.mode;
        const checked = block.querySelectorAll('input:checked');
        if (mode === 'single_required' && checked.length === 0) {
            showToast('Please pick an option for ' + block.querySelector('h4').textContent);
            return;
        }
        for (const inp of checked) {
            selected.push({
                id: parseInt(inp.value),
                name: inp.dataset.name,
                price_delta: parseFloat(inp.dataset.delta) || 0,
            });
        }
    }
    const menu = pendingMenu;
    closeOptionsModal();
    addLine(menu, selected);
}

function orderPrev() { if (orderPage > 0) { orderPage--; renderOrder(); } }
function orderNext() {
    if (orderPage < Math.ceil(order.length / ORDER_PAGE_SIZE) - 1) { orderPage++; renderOrder(); }
}

async function checkout() {
    if (order.length === 0 || !orderCode) return;
    const btn = document.querySelector('button[onclick="checkout()"]');
    btn.disabled = true;
    btn.textContent = 'Processing...';
    try {
        await fetch('/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                order_code: orderCode,
                items: order.map(o => ({
                    menu_id: o.id,
                    name: o.name,
                    price: o.price,
                    qty: o.qty,
                    option_ids: (o.options || []).map(op => op.id),
                    options: o.options || [],
                })),
            }),
        });
    } catch (e) {
        console.error('checkout error:', e);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Pay';
    }
    order = [];
    orderCode = null;
    orderPage = 0;
    renderOrder();
}

function openSettings() {
    document.getElementById('settings-modal').classList.remove('hidden');
    updateFullscreenBtn();
}

function closeSettings() {
    document.getElementById('settings-modal').classList.add('hidden');
}

function updateFullscreenBtn() {
    const btn = document.getElementById('fullscreen-btn');
    btn.textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Enter Full Screen';
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

document.addEventListener('fullscreenchange', () => {
    updateFullscreenBtn();
});

// ── Toast ──────────────────────────────────────────────────────────────
function showToast(msg) {
    const el = document.createElement('div');
    el.className = 'bg-gray-900 text-white text-sm px-5 py-3 rounded-xl shadow-lg opacity-0 transition-opacity duration-300';
    el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    requestAnimationFrame(() => { el.style.opacity = '1'; });
    setTimeout(() => {
        el.style.opacity = '0';
        el.addEventListener('transitionend', () => el.remove());
    }, 5000);
}

// ── SSE — menu status updates ──────────────────────────────────────────
function connectEvents() {
    const url = API_BASE.replace(/^http/, 'http') + '/events';
    const es = new EventSource(url);

    es.addEventListener('menu_status', e => {
        const { id, active, name } = JSON.parse(e.data);

        // 1. Update in-memory menu list
        const menu = menus.find(m => m.id === id);
        if (menu) menu.active = active;

        // 2. Patch the visible button in-place if it's on the current page
        const btn = document.querySelector(`[data-menu-id="${id}"]`);
        if (btn) {
            if (active) {
                btn.disabled = false;
                btn.className = 'w-full h-full bg-white border-2 rounded-xl flex flex-col items-center justify-center hover:bg-blue-50 active:bg-blue-100';
                btn.innerHTML = `
                    <div class="font-bold text-base px-1 text-center leading-tight">${menu.name}</div>
                    <div class="text-blue-600 font-medium text-sm mt-1">฿${menu.price.toFixed(2)}</div>`;
            } else {
                btn.disabled = true;
                btn.className = 'w-full h-full bg-gray-100 border-2 border-gray-200 rounded-xl flex flex-col items-center justify-center opacity-50 cursor-not-allowed';
                btn.innerHTML = `
                    <div class="font-bold text-base px-1 text-center leading-tight text-gray-400">${menu.name}</div>
                    <div class="text-gray-400 font-medium text-sm mt-1">Unavailable</div>`;
            }
        }

        // 3. Remove disabled item from current order
        if (!active) {
            const idx = order.findIndex(o => o.id === id);
            if (idx !== -1) {
                order.splice(idx, 1);
                renderOrder();
                showToast(`"${name}" was disabled and removed from your order.`);
                return;
            }
        }

        // 4. Toast for status change (no order impact)
        showToast(active ? `"${name}" is now available.` : `"${name}" is now unavailable.`);
    });

    es.onerror = () => {
        // browser will auto-reconnect; silence the console noise
    };
}

init();
connectEvents();
</script>

<!-- Toast container -->
<div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 z-50 pointer-events-none"></div>
{{end}}
